<section class="hero">

    <div class="hero-inner">

        <div class="hero-brand">
            <img class="hero-avatar" src="{{ "goldie-400x400.jpg" | relURL }}" alt="{{ i18n "hero_name" }}" width="80" height="80" loading="eager">
        </div>

        <h1 class="hero-title">
            {{ i18n "hero_name" }}
        </h1>

        <p class="hero-subtitle">
            {{ i18n "hero_subtitle" }}
        </p>

        <p class="hero-tagline">
            {{ i18n "hero_tagline" }}
        </p>

        <div class="hero-actions">
            <a href="{{ "posts/" | relLangURL }}" class="hero-btn primary">
                {{ i18n "read_articles" }}
            </a>
            <a href="{{ "about/" | relLangURL }}" class="hero-btn ghost">
                {{ i18n "hero_about" }}
            </a>
        </div>

    </div>

    <footer class="hero-footer">
        <p>
            {{ partial "footer_copyright.html" (dict "sep" "hero-footer-sep") }}
        </p>
    </footer>

</section>
