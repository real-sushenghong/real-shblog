<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories 神经网络关系图 | Real ShengHong</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* ==================== 全局重置与深色主题 ==================== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0e1a;
    font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    color: #fff;
    user-select: none;
}

/* ==================== 标题与信息栏 ==================== */
.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(10,14,26,0.95) 0%, rgba(10,14,26,0) 100%);
}

.header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
    text-shadow: 0 0 40px rgba(96,165,250,0.3);
}

.header .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    -webkit-text-fill-color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
}

.header .stats {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    text-align: right;
    pointer-events: auto;
    line-height: 1.6;
}

.header .stats span {
    display: inline-block;
    margin-left: 16px;
}

.header .stats .num {
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

/* ==================== 图例 ==================== */
.legend {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 20px;
    padding: 10px 24px;
    background: rgba(10,14,26,0.8);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    pointer-events: auto;
    flex-wrap: wrap;
    justify-content: center;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    cursor: default;
    transition: color 0.2s;
}

.legend-item:hover {
    color: rgba(255,255,255,0.9);
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

/* ==================== 底部操作提示 ==================== */
.hint {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.5px;
    text-align: center;
    pointer-events: none;
    transition: opacity 1s;
}

/* ==================== SVG 容器 ==================== */
#graph {
    width: 100vw;
    height: 100vh;
    display: block;
    cursor: grab;
}

#graph:active {
    cursor: grabbing;
}

/* ==================== 节点标签 ==================== */
.node-label {
    font-size: 13px;
    font-weight: 600;
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    text-shadow:
        0 0 8px rgba(0,0,0,0.9),
        0 0 20px rgba(0,0,0,0.7);
    transition: opacity 0.3s;
}

/* ==================== 加载与响应式 ==================== */
.loading {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0e1a;
    transition: opacity 0.8s ease;
}

.loading.fade-out {
    opacity: 0;
    pointer-events: none;
}

.loading-spinner {
    width: 48px;
    height: 48px;
    border: 2px solid rgba(96,165,250,0.15);
    border-top-color: #60a5fa;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

.loading-text {
    margin-top: 16px;
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
    .header {
        padding: 14px 18px;
        flex-direction: column;
        gap: 6px;
    }
    .header h1 {
        font-size: 17px;
    }
    .header .stats {
        text-align: left;
        font-size: 11px;
    }
    .header .stats span {
        margin-left: 0;
        margin-right: 12px;
    }
    .legend {
        bottom: 14px;
        gap: 8px;
        padding: 8px 14px;
    }
    .legend-item {
        font-size: 10px;
    }
    .hint {
        bottom: 64px;
        font-size: 10px;
    }
    .node-label {
        font-size: 10px;
    }
}
</style>
</head>
<body>

<!-- ==================== 加载遮罩 ==================== -->
<div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在构建神经网络...</div>
</div>

<!-- ==================== 顶部标题 ==================== -->
<header class="header">
    <div>
        <h1>🧬 Categories 神经网络关系图</h1>
        <div class="subtitle">基于文章分类与关联强度的力导向布局</div>
    </div>
    <div class="stats" id="stats">
        <span>节点 <span class="num" id="nodeCount">0</span></span>
        <span>连接 <span class="num" id="linkCount">0</span></span>
    </div>
</header>

<!-- ==================== SVG 绘图区 ==================== -->
<svg id="graph"></svg>

<!-- ==================== 底部图例 ==================== -->
<div class="legend" id="legend"></div>

<!-- ==================== 操作提示 ==================== -->
<div class="hint" id="hint">滚轮缩放 · 拖拽平移 · 悬停高亮 · 点击固定</div>

<script>
// ================================================================
// 1. 数据定义 —— 基于博客实际分类体系
// ================================================================

// 分类节点数据
// id: 唯一标识, group: 分组(颜色), weight: 权重(影响节点大小), label: 显示名称
const categoriesData = [
    { id: 'ai-engineering',     group: 1, weight: 85, label: 'AI Engineering',    labelZh: 'AI 工程',      desc: 'LLMs, Agents, 应用实践' },
    { id: 'cloud-native',       group: 2, weight: 80, label: 'Cloud Native',      labelZh: '云原生',        desc: 'Kubernetes, Service Mesh, Envoy' },
    { id: 'kubernetes',         group: 3, weight: 75, label: 'Kubernetes',        labelZh: 'Kubernetes',   desc: '集群架构, 调度, Operator' },
    { id: 'ai-infrastructure',  group: 4, weight: 70, label: 'AI Infrastructure', labelZh: 'AI 基础设施',   desc: 'GPU 集群, 推理服务' },
    { id: 'runtime',            group: 5, weight: 60, label: 'Runtime',           labelZh: '运行时',        desc: 'Container/Agent Runtime' },
    { id: 'go-linux',           group: 6, weight: 50, label: 'Go & Linux',        labelZh: 'Go & Linux',   desc: '系统编程, 网络, 存储' },
];

// 分类间关联数据
// source/target: 节点id, value: 关联强度(影响线宽和透明度)
const relationData = [
    { source: 'ai-engineering',    target: 'ai-infrastructure', value: 8 },
    { source: 'ai-engineering',    target: 'cloud-native',      value: 5 },
    { source: 'ai-engineering',    target: 'kubernetes',        value: 4 },
    { source: 'cloud-native',      target: 'kubernetes',        value: 9 },
    { source: 'cloud-native',      target: 'runtime',           value: 4 },
    { source: 'kubernetes',        target: 'ai-infrastructure', value: 6 },
    { source: 'kubernetes',        target: 'runtime',           value: 7 },
    { source: 'kubernetes',        target: 'go-linux',          value: 5 },
    { source: 'ai-infrastructure', target: 'runtime',           value: 5 },
    { source: 'runtime',           target: 'go-linux',          value: 6 },
    { source: 'cloud-native',      target: 'ai-infrastructure', value: 3 },
    { source: 'ai-engineering',    target: 'runtime',           value: 3 },
];

// ================================================================
// 2. 颜色方案 —— 每个 group 对应一种科技感颜色
// ================================================================
const colorScale = d3.scaleOrdinal()
    .domain([1, 2, 3, 4, 5, 6])
    .range([
        '#60a5fa', // AI Engineering - 蓝色
        '#a78bfa', // Cloud Native - 紫色
        '#34d399', // Kubernetes - 翠绿
        '#f472b6', // AI Infrastructure - 粉色
        '#fbbf24', // Runtime - 琥珀
        '#38bdf8', // Go & Linux - 亮蓝
    ]);

// ================================================================
// 3. 初始化 SVG 与容器
// ================================================================
const svg = d3.select('#graph');
const width = window.innerWidth;
const height = window.innerHeight;

svg.attr('width', width).attr('height', height);

// 主容器组：用于整体平移缩放
const g = svg.append('g').attr('class', 'main-group');

// 滤镜定义 —— 外发光效果
const defs = svg.append('defs');

// --- 节点发光滤镜 ---
const glowFilter = defs.append('filter')
    .attr('id', 'node-glow')
    .attr('x', '-50%')
    .attr('y', '-50%')
    .attr('width', '200%')
    .attr('height', '200%');

glowFilter.append('feGaussianBlur')
    .attr('stdDeviation', '6')
    .attr('result', 'blur');

const glowMerge = glowFilter.append('feMerge');
glowMerge.append('feMergeNode').attr('in', 'blur');
glowMerge.append('feMergeNode').attr('in', 'SourceGraphic');

// --- 更强的悬停发光滤镜 ---
const glowFilterHover = defs.append('filter')
    .attr('id', 'node-glow-hover')
    .attr('x', '-80%')
    .attr('y', '-80%')
    .attr('width', '260%')
    .attr('height', '260%');

glowFilterHover.append('feGaussianBlur')
    .attr('stdDeviation', '12')
    .attr('result', 'blur');

const glowMergeHover = glowFilterHover.append('feMerge');
glowMergeHover.append('feMergeNode').attr('in', 'blur');
glowMergeHover.append('feMergeNode').attr('in', 'SourceGraphic');

// --- 粒子发光滤镜 ---
const particleFilter = defs.append('filter')
    .attr('id', 'particle-glow')
    .attr('x', '-100%')
    .attr('y', '-100%')
    .attr('width', '300%')
    .attr('height', '300%');

particleFilter.append('feGaussianBlur')
    .attr('stdDeviation', '3')
    .attr('result', 'blur');

particleFilter.append('feMerge')
    .selectAll('feMergeNode')
    .data(['blur', 'SourceGraphic'])
    .join('feMergeNode')
    .attr('in', d => d);

// ================================================================
// 4. 数据校验与容错
// ================================================================

// 建立节点 id 索引，用于校验 link 引用
const nodeIds = new Set(categoriesData.map(n => n.id));

// 过滤掉引用了不存在节点的链接
const validLinks = relationData.filter(d => {
    const src = typeof d.source === 'object' ? d.source.id : d.source;
    const tgt = typeof d.target === 'object' ? d.target.id : d.target;
    if (!nodeIds.has(src) || !nodeIds.has(tgt)) {
        console.warn(`[容错] 忽略无效连接: ${src} -> ${tgt} (节点不存在)`);
        return false;
    }
    return true;
});

// 深度克隆节点数据以供 D3 使用
const nodes = categoriesData.map(d => ({ ...d }));
const links = validLinks.map(d => ({ ...d }));

// 更新统计显示
document.getElementById('nodeCount').textContent = nodes.length;
document.getElementById('linkCount').textContent = links.length;

// ================================================================
// 5. 构建图例
// ================================================================

const legendEl = document.getElementById('legend');
categoriesData.forEach(d => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.background = colorScale(d.group);
    item.appendChild(dot);
    // 根据页面语言偏好显示标签
    const lang = document.documentElement.lang || 'zh-CN';
    item.appendChild(document.createTextNode(lang.startsWith('zh') ? d.labelZh : d.label));
    legendEl.appendChild(item);
});

// ================================================================
// 6. 力导向模拟器
// ================================================================

const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links)
        .id(d => d.id)
        .distance(d => 180 - d.value * 8) // 关联越强距离越近
        .strength(d => d.value / 12)       // 关联越强拉力越大
    )
    .force('charge', d3.forceManyBody()
        .strength(-350)                     // 斥力，防止重叠
        .distanceMax(600)
    )
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide()
        .radius(d => Math.sqrt(d.weight) * 2.5 + 20) // 碰撞半径
    );

// ================================================================
// 7. 绘制连线（贝塞尔曲线 + 粒子流）
// ================================================================

// 计算贝塞尔曲线路径
function bezierPath(d) {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dr = Math.sqrt(dx * dx + dy * dy);

    // 控制点偏移量，产生弯曲效果
    const curvature = 0.3;
    const mx = (d.source.x + d.target.x) / 2;
    const my = (d.source.y + d.target.y) / 2;
    const nx = -dy / dr * dr * curvature;
    const ny = dx / dr * dr * curvature;

    return `M${d.source.x},${d.source.y} Q${mx + nx},${my + ny} ${d.target.x},${d.target.y}`;
}

// 获取连线中点（用于粒子起始位置计算）
function getMidpoint(d, t) {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dr = Math.sqrt(dx * dx + dy * dy);
    const curvature = 0.3;
    const mx = (d.source.x + d.target.x) / 2;
    const my = (d.source.y + d.target.y) / 2;
    const nx = -dy / dr * dr * curvature;
    const ny = dx / dr * dr * curvature;

    // 贝塞尔 Q 曲线参数方程: B(t) = (1-t)²P₀ + 2(1-t)tP₁ + t²P₂
    const t1 = t;
    const cx = (1-t1)*(1-t1)*d.source.x + 2*(1-t1)*t1*(mx+nx) + t1*t1*d.target.x;
    const cy = (1-t1)*(1-t1)*d.source.y + 2*(1-t1)*t1*(my+ny) + t1*t1*d.target.y;
    return { x: cx, y: cy };
}

// --- 绘制连线 ---
const linkGroup = g.append('g').attr('class', 'links');

const linkElements = linkGroup.selectAll('.link')
    .data(links)
    .join('path')
    .attr('class', 'link')
    .attr('fill', 'none')
    .attr('stroke', d => {
        const c1 = d3.color(colorScale(d.source.group));
        const c2 = d3.color(colorScale(d.target.group));
        // 混合两个节点的颜色作为连线颜色
        return d3.interpolateRgb(c1, c2)(0.5);
    })
    .attr('stroke-width', d => Math.sqrt(d.value) * 1.8)
    .attr('stroke-opacity', d => 0.2 + d.value * 0.06)
    .attr('d', bezierPath)
    .attr('data-source', d => d.source.id)
    .attr('data-target', d => d.target.id);

// --- 连线背景光晕（底层更粗的线，制造发光效果） ---
linkGroup.selectAll('.link-glow')
    .data(links)
    .join('path')
    .attr('class', 'link-glow')
    .attr('fill', 'none')
    .attr('stroke', d => {
        const c1 = d3.color(colorScale(d.source.group));
        const c2 = d3.color(colorScale(d.target.group));
        return d3.interpolateRgb(c1, c2)(0.5);
    })
    .attr('stroke-width', d => Math.sqrt(d.value) * 3.5)
    .attr('stroke-opacity', 0.05)
    .attr('d', bezierPath)
    .attr('filter', 'url(#node-glow)');

// --- 粒子流动动画 ---
const particleGroup = g.append('g').attr('class', 'particles');

// 为每条连线创建一组粒子
const particlesPerLink = 3;
let particleData = [];

links.forEach((link, linkIdx) => {
    for (let i = 0; i < particlesPerLink; i++) {
        particleData.push({
            linkIdx: linkIdx,
            // 每个粒子错开相位，形成连续流动感
            progress: i / particlesPerLink + Math.random() * 0.1,
            speed: 0.0015 + Math.random() * 0.001,
            size: 1.5 + Math.random() * 2,
        });
    }
});

const particleElements = particleGroup.selectAll('.particle')
    .data(particleData)
    .join('circle')
    .attr('class', 'particle')
    .attr('r', d => d.size)
    .attr('fill', d => {
        const link = links[d.linkIdx];
        const c1 = d3.color(colorScale(link.source.group));
        const c2 = d3.color(colorScale(link.target.group));
        return d3.interpolateRgb(c1, c2)(0.5);
    })
    .attr('filter', 'url(#particle-glow)')
    .attr('opacity', 0.7);

// ================================================================
// 8. 绘制节点
// ================================================================

const nodeGroup = g.append('g').attr('class', 'nodes');

// 节点半径映射：按 weight 开平方
const radiusScale = d => Math.sqrt(d.weight) * 2.2 + 6;

// --- 节点外圈发光环 ---
nodeGroup.selectAll('.node-glow-ring')
    .data(nodes)
    .join('circle')
    .attr('class', 'node-glow-ring')
    .attr('r', d => radiusScale(d) + 8)
    .attr('fill', d => colorScale(d.group))
    .attr('opacity', 0.08)
    .attr('filter', 'url(#node-glow)')
    .attr('cx', d => d.x)
    .attr('cy', d => d.y);

// --- 节点主体 ---
const nodeElements = nodeGroup.selectAll('.node')
    .data(nodes)
    .join('circle')
    .attr('class', 'node')
    .attr('r', d => radiusScale(d))
    .attr('fill', d => colorScale(d.group))
    .attr('stroke', d => d3.color(colorScale(d.group)).brighter(0.5))
    .attr('stroke-width', 1.5)
    .attr('cx', d => d.x)
    .attr('cy', d => d.y)
    .attr('filter', 'url(#node-glow)')
    .attr('cursor', 'pointer')
    // 存储节点 id 用于交互
    .attr('data-id', d => d.id);

// --- 节点高亮内圈（悬停时显示） ---
nodeGroup.selectAll('.node-inner-ring')
    .data(nodes)
    .join('circle')
    .attr('class', 'node-inner-ring')
    .attr('r', d => radiusScale(d) * 0.6)
    .attr('fill', 'none')
    .attr('stroke', d => d3.color(colorScale(d.group)).brighter(1))
    .attr('stroke-width', 0)
    .attr('cx', d => d.x)
    .attr('cy', d => d.y)
    .attr('opacity', 0);

// --- 节点标签 ---
const labelElements = nodeGroup.selectAll('.node-label')
    .data(nodes)
    .join('text')
    .attr('class', 'node-label')
    .attr('x', d => d.x)
    .attr('y', d => d.y)
    .text(d => {
        const lang = document.documentElement.lang || 'zh-CN';
        return lang.startsWith('zh') ? d.labelZh : d.label;
    });

// ================================================================
// 9. 交互功能
// ================================================================

// --- 9a. 拖拽 ---
const dragHandler = d3.drag()
    .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    })
    .on('drag', (event, d) => {
        d.fx = event.x;
        d.fy = event.y;
    })
    .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        // 拖拽结束时不固定，除非用户点击固定
        // 但如果节点被标记为 fixed，则保持固定
        if (!d._fixed) {
            d.fx = null;
            d.fy = null;
        }
    });

nodeElements.call(dragHandler);

// --- 9b. 点击固定/取消固定 ---
nodeElements.on('click', (event, d) => {
    event.stopPropagation();
    d._fixed = !d._fixed;
    if (d._fixed) {
        d.fx = d.x;
        d.fy = d.y;
        d3.select(event.currentTarget)
            .attr('stroke-width', 3)
            .attr('stroke', '#fff');
    } else {
        d.fx = null;
        d.fy = null;
        d3.select(event.currentTarget)
            .attr('stroke-width', 1.5)
            .attr('stroke', d => d3.color(colorScale(d.group)).brighter(0.5));
    }
});

// 点击空白取消所有高亮
svg.on('click', () => {
    resetHighlight();
});

// --- 9c. 悬停高亮 ---
function highlightNode(d) {
    // 获取当前节点的所有邻居节点 id 和相连的连线
    const neighborIds = new Set([d.id]);
    const connectedLinks = [];

    links.forEach(l => {
        const srcId = typeof l.source === 'object' ? l.source.id : l.source;
        const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
        if (srcId === d.id || tgtId === d.id) {
            neighborIds.add(srcId);
            neighborIds.add(tgtId);
            connectedLinks.push(l);
        }
    });

    // 节点高亮/变暗
    nodeElements
        .transition().duration(200)
        .attr('opacity', n => neighborIds.has(n.id) ? 1 : 0.15);

    // 节点发光环高亮/变暗
    nodeGroup.selectAll('.node-glow-ring')
        .transition().duration(200)
        .attr('opacity', n => neighborIds.has(n.id) ? 0.25 : 0.04);

    // 标签高亮/变暗
    labelElements
        .transition().duration(200)
        .attr('opacity', n => neighborIds.has(n.id) ? 1 : 0.15);

    // 连线高亮/变暗
    linkElements
        .transition().duration(200)
        .attr('stroke-opacity', l => {
            const srcId = typeof l.source === 'object' ? l.source.id : l.source;
            const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
            if (srcId === d.id || tgtId === d.id) {
                return 0.6 + l.value * 0.04;
            }
            return 0.04;
        })
        .attr('stroke-width', l => {
            const srcId = typeof l.source === 'object' ? l.source.id : l.source;
            const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
            if (srcId === d.id || tgtId === d.id) {
                return Math.sqrt(l.value) * 2.5;
            }
            return Math.sqrt(l.value) * 1;
        });

    // 连线光晕高亮/变暗
    g.selectAll('.link-glow')
        .transition().duration(200)
        .attr('stroke-opacity', l => {
            const srcId = typeof l.source === 'object' ? l.source.id : l.source;
            const tgtId = typeof l.target === 'object' ? l.target.id : l.target;
            if (srcId === d.id || tgtId === d.id) {
                return 0.15;
            }
            return 0.02;
        });

    // 粒子高亮/变暗
    particleElements
        .transition().duration(200)
        .attr('opacity', p => {
            const link = links[p.linkIdx];
            const srcId = typeof link.source === 'object' ? link.source.id : link.source;
            const tgtId = typeof link.target === 'object' ? link.target.id : link.target;
            return (srcId === d.id || tgtId === d.id) ? 0.9 : 0.1;
        });
}

function resetHighlight() {
    nodeElements.transition().duration(300).attr('opacity', 1);
    nodeGroup.selectAll('.node-glow-ring').transition().duration(300).attr('opacity', 0.08);
    labelElements.transition().duration(300).attr('opacity', 1);
    linkElements.transition().duration(300)
        .attr('stroke-opacity', l => 0.2 + l.value * 0.06)
        .attr('stroke-width', l => Math.sqrt(l.value) * 1.8);
    g.selectAll('.link-glow').transition().duration(300).attr('stroke-opacity', 0.05);
    particleElements.transition().duration(300).attr('opacity', 0.7);
}

nodeElements
    .on('mouseenter', (event, d) => { highlightNode(d); })
    .on('mouseleave', () => { resetHighlight(); });

// ================================================================
// 10. 缩放与平移
// ================================================================

const zoomHandler = d3.zoom()
    .scaleExtent([0.3, 4])
    .on('zoom', (event) => {
        g.attr('transform', event.transform);
    });

svg.call(zoomHandler);

// ================================================================
// 11. 模拟 tick 更新
// ================================================================

// 呼吸动画计数器
let breathePhase = 0;

simulation.on('tick', () => {
    // 更新连线路径
    linkElements.attr('d', bezierPath);
    g.selectAll('.link-glow').attr('d', bezierPath);

    // 更新节点位置
    nodeElements
        .attr('cx', d => d.x)
        .attr('cy', d => d.y);

    nodeGroup.selectAll('.node-glow-ring')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y);

    nodeGroup.selectAll('.node-inner-ring')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y);

    labelElements
        .attr('x', d => d.x)
        .attr('y', d => d.y);
});

// ================================================================
// 12. 粒子动画更新（独立 requestAnimationFrame 循环）
// ================================================================

function animateParticles(timestamp) {
    // 更新每个粒子的位置
    particleElements.each(p => {
        p.progress += p.speed;
        if (p.progress > 1) {
            p.progress = 0;
            // 每次循环略微改变速度，增加随机感
            p.speed = 0.0015 + Math.random() * 0.001;
        }

        const link = links[p.linkIdx];
        if (link && link.source && link.target) {
            const pos = getMidpoint(link, p.progress);
            d3.select(this)
                .attr('cx', pos.x)
                .attr('cy', pos.y);
        }
    });

    requestAnimationFrame(animateParticles);
}

// ================================================================
// 13. 节点呼吸动画
// ================================================================

function animateBreathing(timestamp) {
    breathePhase += 0.02;
    const pulse = 1 + Math.sin(breathePhase) * 0.03;

    nodeElements
        .attr('transform', d => {
            // 轻微呼吸缩放
            const s = pulse;
            return `translate(${-d.x * (s - 1)}, ${-d.y * (s - 1)}) scale(${s})`;
        });

    requestAnimationFrame(animateBreathing);
}

// ================================================================
// 14. 窗口 resize 自适应
// ================================================================

window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;

    svg.attr('width', w).attr('height', h);
    simulation.force('center', d3.forceCenter(w / 2, h / 2));
    simulation.alpha(0.3).restart();
});

// ================================================================
// 15. 启动
// ================================================================

// 隐藏加载遮罩
document.getElementById('loading').classList.add('fade-out');
setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
}, 800);

// 启动粒子动画
requestAnimationFrame(animateParticles);

// 启动呼吸动画
requestAnimationFrame(animateBreathing);

// 3 秒后淡出操作提示
setTimeout(() => {
    document.getElementById('hint').style.opacity = '0';
}, 5000);

// ================================================================
// 16. 键盘快捷键
// ================================================================

document.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        // 按 R 键重置视图
        svg.transition().duration(750).call(zoomHandler.transform, d3.zoomIdentity);
        // 释放所有固定节点
        nodes.forEach(n => {
            n._fixed = false;
            n.fx = null;
            n.fy = null;
        });
        nodeElements
            .attr('stroke-width', 1.5)
            .attr('stroke', d => d3.color(colorScale(d.group)).brighter(0.5));
        simulation.alpha(0.5).restart();
        resetHighlight();
    }
});

console.log('🧬 Categories 神经网络关系图已启动');
console.log(`📊 ${nodes.length} 个节点, ${links.length} 条连接`);
console.log('💡 操作提示: 滚轮缩放 · 拖拽平移 · 悬停高亮 · 点击固定 · R 键重置');
</script>

</body>
